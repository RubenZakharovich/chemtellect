[project]
name = "chemtellect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruben Manukyan", email = "rubenzakharovich@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "nmslib==2.1.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "rdkit>=2026.9.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
]
